port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

redis:
  address: redis:6379

turn:
  enabled: true
  udp_port: 3478

# This file is not consumed by compose.yaml in the current setup; compose.yaml
# generates /tmp/livekit.yaml at runtime. If you run LiveKit with this file
# directly, replace YOUR_LIVEKIT_API_KEY with the configured signing key.
webhook:
  api_key: YOUR_LIVEKIT_API_KEY
  urls:
    - http://app:8000/webhooks/livekit

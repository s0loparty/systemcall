name: app checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_KEY: base64:seIiB3mYvfRbcdm8pkdleIfF+EnxWpupz1p0yQ2I9Cg=
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: 'null'
      LIVEKIT_URL: https://livekit.test
      LIVEKIT_API_KEY: test-key
      LIVEKIT_API_SECRET: test-secret-test-secret-test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Bun dependencies
        run: bun install

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Build frontend assets
        run: bun run build

      - name: PHP format check
        run: ./vendor/bin/pint --test --format agent

      - name: PHP static analysis
        run: ./vendor/bin/phpstan analyse

      - name: Frontend typecheck
        run: bun run types:check

      - name: Frontend lint
        run: bun run lint:check

      - name: Frontend format check
        run: bun run format:check

      - name: Unit and feature tests
        run: php artisan test --compact

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_livekit_e2e:
        description: 'Run full LiveKit/Reverb browser E2E suite'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_KEY: base64:seIiB3mYvfRbcdm8pkdleIfF+EnxWpupz1p0yQ2I9Cg=
  APP_DEBUG: false

  DB_CONNECTION: sqlite
  DB_DATABASE: database/database.sqlite

  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  BROADCAST_CONNECTION: 'null'

  LIVEKIT_URL: https://livekit.test
  LIVEKIT_API_KEY: test-key
  LIVEKIT_API_SECRET: test-secret-test-secret-test-secret
  LIVEKIT_TOKEN_TTL: 600

jobs:
  # ---------------------------------------------------------------------------
  # 1. Static checks + unit/feature tests
  # ---------------------------------------------------------------------------
  checks:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # The project uses npm/package-lock.json as the source of truth,
      # but Bun is intentionally used in CI for faster installs/builds.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies with Bun
        run: bun install

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Build frontend assets
        run: bun run build

      - name: PHP format check
        run: ./vendor/bin/pint --test --format agent

      - name: PHP static analysis
        run: ./vendor/bin/phpstan analyse

      - name: Frontend typecheck
        run: bun run types:check

      - name: Frontend lint
        run: bun run lint:check

      - name: Frontend format check
        run: bun run format:check

      - name: Unit and feature tests
        run: php artisan test --compact

  # ---------------------------------------------------------------------------
  # 2. Fast browser smoke tests
  # ---------------------------------------------------------------------------
  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies with Bun
        run: bun install

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Build frontend assets
        run: bun run build

      - name: Run browser smoke tests
        run: php artisan test tests/Browser/HomeSmokeTest.php tests/Browser/RoomNavigationSmokeTest.php --compact

      - name: Upload browser artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-smoke-artifacts
          path: |
            tests/Browser/Screenshots
            storage/logs
            test-results
            playwright-report
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Full LiveKit + Reverb browser E2E
  #
  # Preserves the old behavior:
  # - automatically on the weekly schedule;
  # - manually through workflow_dispatch;
  # - not on every push / pull request.
  # ---------------------------------------------------------------------------
  livekit-e2e:
    name: LiveKit E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - checks
      - browser-smoke

    if: >-
      ${{
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_livekit_e2e)
      }}

    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_KEY: base64:seIiB3mYvfRbcdm8pkdleIfF+EnxWpupz1p0yQ2I9Cg=
      APP_DEBUG: false

      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

      CACHE_STORE: redis
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: reverb

      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: 'null'

      REVERB_APP_ID: local-app
      REVERB_APP_KEY: local-key
      REVERB_APP_SECRET: local-secret
      REVERB_SERVER_HOST: 127.0.0.1
      REVERB_SERVER_PORT: 8080
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http

      VITE_REVERB_APP_KEY: local-key
      VITE_REVERB_HOST: 127.0.0.1
      VITE_REVERB_PORT: 8080
      VITE_REVERB_SCHEME: http

      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: local-livekit-secret-local-livekit-secret
      LIVEKIT_TOKEN_TTL: 3600

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies with Bun
        run: bun install

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate:fresh --force

      - name: Build frontend assets
        run: bun run build

      - name: Start LiveKit
        run: |
          cat > /tmp/livekit-ci.yaml <<'YAML'
          keys:
            devkey: local-livekit-secret-local-livekit-secret
          port: 7880
          bind_addresses:
            - "0.0.0.0"
          log_level: info
          rtc:
            tcp_port: 7881
            port_range_start: 50000
            port_range_end: 50020
            use_external_ip: false
            node_ip: "127.0.0.1"
          redis:
            address: 127.0.0.1:6379
          turn:
            enabled: true
            udp_port: 3478
          YAML

          docker run \
            --rm \
            -d \
            --name livekit-ci \
            --network host \
            -v /tmp/livekit-ci.yaml:/livekit.yaml \
            livekit/livekit-server:v1.13.4 \
            --config /livekit.yaml

      - name: Start Reverb
        run: |
          php artisan reverb:start \
            --host=127.0.0.1 \
            --port=8080 \
            > storage/logs/reverb-ci.log 2>&1 &

          echo $! > /tmp/reverb-ci.pid

      - name: Wait for LiveKit
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7880 >/dev/null; then
              exit 0
            fi

            sleep 1
          done

          echo "LiveKit did not become ready in time."
          docker logs livekit-ci || true
          exit 1

      - name: Run full browser E2E tests
        run: php artisan test tests/Browser --compact

      - name: Collect service logs
        if: failure()
        run: |
          docker logs livekit-ci > storage/logs/livekit-ci.log 2>&1 || true

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: livekit-e2e-artifacts
          path: |
            tests/Browser/Screenshots
            storage/logs
            test-results
            playwright-report
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/reverb-ci.pid ]; then
            kill "$(cat /tmp/reverb-ci.pid)" || true
          fi

          docker rm -f livekit-ci || true

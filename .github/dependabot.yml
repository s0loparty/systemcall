version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      official-github-actions:
        patterns:
          - "actions/checkout"
          - "actions/cache"
          - "actions/upload-artifact"
      setup-actions:
        patterns:
          - "oven-sh/setup-bun"
          - "shivammathur/setup-php"
